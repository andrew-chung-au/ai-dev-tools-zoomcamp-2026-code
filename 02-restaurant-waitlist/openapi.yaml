        - serviceDate
      properties:
        ticketCode:
          type: string
        guestName:
          type: string
        partySize:
          type: integer
        status:
          $ref: "#/components/schemas/WaitlistStatus"
        estimatedWaitMinutes:
          type: integer
        message:
