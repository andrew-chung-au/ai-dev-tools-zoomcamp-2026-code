        mobileNumber:
          type: string
        seatingNote:
          type: string
        policyAcknowledged:
          type: boolean

    CreateGuestEntryResult:
      oneOf:
        - $ref: "#/components/schemas/CreateGuestEntryResultEntry"
        - $ref: "#/components/schemas/CreateGuestEntryResultLargePartyEnquiry"
        - $ref: "#/components/schemas/CreateGuestEntryResultClosed"
      discriminator:
        propertyName: kind
        mapping:
          entry: "#/components/schemas/CreateGuestEntryResultEntry"
          large_party_enquiry: "#/components/schemas/CreateGuestEntryResultLargePartyEnquiry"
          closed: "#/components/schemas/CreateGuestEntryResultClosed"

    CreateGuestEntryResultEntry:
      type: object
      required: [kind, entry, accessToken, message]
      properties:
        kind:
          type: string
          enum: [entry]
