        accessToken:
          type: string
        message:
          type: string

    CreateGuestEntryResultLargePartyEnquiry:
      type: object
      required: [kind, enquiry, message]
      properties:
        kind:
          type: string
          enum: [large_party_enquiry]
        enquiry:
          $ref: "#/components/schemas/LargePartyEnquiry"
        message:
          type: string

    CreateGuestEntryResultClosed:
      type: object
      required: [kind, message]
      properties:
        kind:
          type: string
          enum: [closed]
        message:
          type: string

