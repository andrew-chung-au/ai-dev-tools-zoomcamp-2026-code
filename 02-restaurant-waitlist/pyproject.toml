[project]
name = "restaurant-waitlist-backend"
version = "0.1.0"
description = "FastAPI backend (in-memory store) for the Table Ready restaurant waitlist app."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs Docker (docker-compose.yml stack); excluded from the default run",
]
addopts = "-m 'not integration'"
