# OpenTelemetry Collector: receives OTLP from the app and routes
# metrics -> Prometheus, logs -> Loki, traces -> Tempo (all over OTLP/HTTP).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s

exporters:
  otlp_http/prometheus:
    # Prometheus' native OTLP receiver (--web.enable-otlp-receiver).
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    tls:
      insecure: true
  otlp_http/loki:
    # Loki's native OTLP ingestion.
    logs_endpoint: http://loki:3100/otlp/v1/logs
    tls:
      insecure: true
  otlp_http/tempo:
    traces_endpoint: http://tempo:4318/v1/traces
    tls:
      insecure: true

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/tempo]
