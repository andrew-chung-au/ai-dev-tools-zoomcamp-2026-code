# Single-process Loki with filesystem storage (local-only, no auth).
# Logs arrive from the Collector on Loki's OTLP endpoint (/otlp).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # OTLP log attributes (trace_id, span_id, order_id, ...) are kept as
  # structured metadata; Grafana's log -> trace link reads trace_id from it.
  allow_structured_metadata: true

analytics:
  reporting_enabled: false
