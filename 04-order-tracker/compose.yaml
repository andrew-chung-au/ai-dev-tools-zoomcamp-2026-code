name: order-tracker

# Collector, Prometheus, Loki, Tempo and Grafana (config in observability/).
include:
  - observability/compose.yaml

services:
  app:
    image: order-tracker:${ORDER_TRACKER_TAG:-local}
    build: .
    ports:
      - "127.0.0.1:${ORDER_TRACKER_PORT:-8000}:8000"
    environment:
      ORDER_DB_PATH: /data/orders.db
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      SERVICE_VERSION: ${SERVICE_VERSION:-${ORDER_TRACKER_TAG:-local}}
      # All three signals go over OTLP/HTTP to the Collector. Export runs in the
      # background: if the Collector is down, requests are unaffected.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Console export (telemetry in `make logs`) is off unless the shell sets
      # OTEL_CONSOLE_EXPORT=true; left empty here, it's passed through or unset.
      OTEL_CONSOLE_EXPORT:
    volumes:
      - orders:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  orders:

networks:
  default:
    ipam:
      config:
        - subnet: ${ORDER_TRACKER_SUBNET:-10.215.24.0/24}
